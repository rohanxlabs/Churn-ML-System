<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#111827"/>
  <text x="450" y="50" fill="#f9fafb" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">Holdout Evaluation Results</text>
  <text x="450" y="80" fill="#9ca3af" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Metrics generated by the repository on 2026-08-10</text>

  <defs>
    <style>
      .card { fill:#1f2937; stroke:#60a5fa; stroke-width:2; rx:18; ry:18; }
      .metric { fill:#e5e7eb; font-family:Arial, sans-serif; font-size:20px; text-anchor:middle; }
      .value { fill:#93c5fd; font-family:Arial, sans-serif; font-size:34px; font-weight:bold; text-anchor:middle; }
      .small { fill:#d1d5db; font-family:Arial, sans-serif; font-size:16px; }
      .muted { fill:#9ca3af; font-family:Arial, sans-serif; font-size:14px; }
    </style>
  </defs>

  <rect class="card" x="65" y="120" width="160" height="120"/>
  <text class="metric" x="145" y="165">Accuracy</text>
  <text class="value" x="145" y="210">0.7381</text>

  <rect class="card" x="255" y="120" width="160" height="120"/>
  <text class="metric" x="335" y="165">Precision</text>
  <text class="value" x="335" y="210">0.5043</text>

  <rect class="card" x="445" y="120" width="160" height="120"/>
  <text class="metric" x="525" y="165">Recall</text>
  <text class="value" x="525" y="210">0.7834</text>

  <rect class="card" x="635" y="120" width="160" height="120"/>
  <text class="metric" x="715" y="165">F1</text>
  <text class="value" x="715" y="210">0.6136</text>

  <rect class="card" x="255" y="270" width="160" height="120"/>
  <text class="metric" x="335" y="315">ROC-AUC</text>
  <text class="value" x="335" y="360">0.8417</text>

  <rect class="card" x="445" y="270" width="350" height="120"/>
  <text class="metric" x="620" y="315">Confusion Matrix</text>
  <text class="small" x="520" y="350">TN: 747</text>
  <text class="small" x="690" y="350">FP: 288</text>
  <text class="small" x="520" y="378">FN: 81</text>
  <text class="small" x="690" y="378">TP: 293</text>

  <text class="small" x="65" y="445">Top global churn drivers from logistic regression coefficients:</text>
  <text class="muted" x="65" y="475">Low tenure, month-to-month contracts, and fiber optic service push churn risk upward.</text>
  <text class="muted" x="65" y="497">Two-year contracts and longer tenure push churn risk downward.</text>
</svg>
